<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Music App</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #111; color: #f5f5f5; }
      .container { max-width: 720px; margin: 0 auto; padding: 2rem; }
      button { padding: 0.75rem 1rem; border: none; border-radius: 999px; background: #ff5a5f; color: white; margin-right: 0.5rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Web Music Player</h1>
      <p>This page is loaded inside the Android WebView and can talk to the native playback service.</p>
      <button onclick="playDemo()">Play demo</button>
      <button onclick="pauseDemo()">Pause</button>
      <button onclick="resumeDemo()">Resume</button>
    </div>
    <script>
      function playDemo() {
        if (window.AndroidMusicBridge) {
          window.AndroidMusicBridge.play('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', 'Demo Track', 'Native Bridge', '');
        }
      }
      function pauseDemo() { if (window.AndroidMusicBridge) window.AndroidMusicBridge.pause(); }
      function resumeDemo() { if (window.AndroidMusicBridge) window.AndroidMusicBridge.resume(); }
    </script>
  </body>
</html>
